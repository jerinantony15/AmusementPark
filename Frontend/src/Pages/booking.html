<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Amusement Park Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:url("https://cdn1.tripoto.com/media/filter/nl/img/2380291/Image/1707875591_mayuresh_kharwade_psskp4tdohk_unsplash.jpg.webp") no-repeat center center fixed;
background-size:cover;
min-height:100vh;
display:flex;
flex-direction:column;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
z-index:-1;
}

.card{
background:rgba(255,255,255,0.95);
border-radius:15px;
margin:auto;
}

</style>

</head>

<body>

<div class="card shadow-lg p-4 w-100" style="max-width:700px;">

<h2 class="text-center mb-4">🎢 Amusement Park Booking</h2>

<form id="bookingForm" class="row g-3">

<div class="col-md-6">
<input type="text" id="name" class="form-control" placeholder="Full Name" required>
</div>

<div class="col-md-6">
<input type="email" id="email" class="form-control" placeholder="Email" required>
</div>

<div class="col-md-6">
<input type="tel" id="phone" class="form-control" placeholder="Phone" required>
</div>

<div class="col-md-6">
<input type="date" id="date" class="form-control" required>
</div>

<div class="col-12">
<label>Ticket Type</label>

<select id="type" class="form-select">

<option value="normal">Normal Ticket (₹500)</option>
<option value="premium">Premium Ticket (₹900)</option>
<option value="membership">Membership (₹3000)</option>

</select>

</div>

<div class="col-12">

<label>Number of People</label>

<input type="number" id="people" class="form-control" value="1" min="1">

</div>

<div class="col-12">

<input type="checkbox" id="parking"> Parking (+₹100)
<br>
<input type="checkbox" id="food"> Food (+₹200/person)

</div>

<div class="col-12">

<h4>Total ₹ <span id="total">0</span></h4>

</div>

<div class="col-12">

<button class="btn btn-primary w-100" type="submit">
Pay & Book Ticket
</button>

</div>

</form>

</div>

<script>

const typeEl=document.getElementById("type")
const peopleEl=document.getElementById("people")
const parkingEl=document.getElementById("parking")
const foodEl=document.getElementById("food")
const totalEl=document.getElementById("total")

function calculateCost(){

let base=0

if(typeEl.value==="normal") base=500
if(typeEl.value==="premium") base=900
if(typeEl.value==="membership") base=3000

let people=parseInt(peopleEl.value)

let total=base*people

if(parkingEl.checked) total+=100
if(foodEl.checked) total+=200*people

totalEl.innerText=total

}

[typeEl,peopleEl,parkingEl,foodEl].forEach(el=>{
el.addEventListener("change",calculateCost)
})

calculateCost()

const form=document.getElementById("bookingForm")

function processBooking(callback){

let bookingData={

name:document.getElementById("name").value,
email:document.getElementById("email").value,
phone:document.getElementById("phone").value,
bookingDate:document.getElementById("date").value,
type:typeEl.value,
people:peopleEl.value,
parking:parkingEl.checked,
food:foodEl.checked,
total:totalEl.innerText,
validFrom:document.getElementById("date").value,
validTill:document.getElementById("date").value

}

console.log("Processing booking...")

setTimeout(()=>{

localStorage.setItem("ticketData",JSON.stringify(bookingData))

console.log("Booking successful")

callback()

},1000)

}

function goToTicket(){

window.location.href="ticket.html"

}

form.addEventListener("submit",function(e){

e.preventDefault()

processBooking(goToTicket)

})

</script>

</body>
</html>
