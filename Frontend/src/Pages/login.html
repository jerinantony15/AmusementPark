<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amusement Park Portal</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:#f5f7fb;
}

.main-container{
    height:100vh;
}

.left-panel img{
    height:100vh;
    width:100%;
    object-fit:cover;
}

.form-panel{
    display:flex;
    align-items:center;
    justify-content:center;
}

.form-box{
    width:85%;
    max-width:520px;
}

.brand-title{
    font-weight:700;
    color:#1f3c88;
}

.nav-pills .nav-link{
    border-radius:30px;
    margin-right:10px;
}
</style>
</head>

<body>

<div class="container-fluid main-container">
<div class="row h-100">

<!-- IMAGE SIDE -->
<div class="col-md-6 left-panel p-0">
<video 
    src="https://ik.imagekit.io/yhjndtcdv/lv_0_20260213175053.mp4?updatedAt=1770985571393"
    autoplay
    loop
    muted
    playsinline
    style="height:100vh; width:100%; object-fit:cover;">
</video>

</div>

<!-- FORM SIDE -->
<div class="col-md-6 form-panel">
<div class="form-box">

<h3 class="brand-title mb-3">Amusement Park Portal</h3>
<p class="text-muted mb-4">Access your visitor account</p>

<!-- LOGIN / REGISTER SWITCH IN ONE ROW -->
<ul class="nav nav-pills mb-4" role="tablist">
<li class="nav-item">
<button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">
<i class="bi bi-box-arrow-in-right"></i> Login
</button>
</li>

<li class="nav-item">
<button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">
<i class="bi bi-person-plus"></i> Register
</button>
</li>
</ul>

<div class="tab-content">

<!-- LOGIN FORM -->
<div class="tab-pane fade show active" id="login">
<form action="home.html" method="post">

<div class="mb-3">
<label>Email / Phone</label>
<div class="input-group">
<span class="input-group-text"><i class="bi bi-person"></i></span>
<input type="text" class="form-control" required placeholder="Enter email or phone">
</div>
</div>

<div class="mb-3">
<label>Password</label>
<div class="input-group">
<span class="input-group-text"><i class="bi bi-lock"></i></span>
<input type="password" class="form-control" required placeholder="Enter password">
</div>
</div>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Remember Me</label>
</div>

<button class="btn btn-primary w-100">Login</button>

</form>
</div>

<!-- REGISTER FORM -->
<div class="tab-pane fade" id="register">
<form action="home.html" method="post" enctype="multipart/form-data">

<div class="mb-3">
<label>Profile Photo</label>
<input type="file" class="form-control">
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label>Full Name</label>
<input type="text" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Age</label>
<input type="number" class="form-control" required>
</div>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Phone</label>
<input type="tel" class="form-control" required>
</div>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label>Gender</label>
<select class="form-select">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>City</label>
<input type="text" class="form-control" required>
</div>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label>ID Proof</label>
<select class="form-select">
<option>Aadhar</option>
<option>Driving License</option>
<option>Passport</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>ID Number</label>
<input type="text" class="form-control" required>
</div>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label>Password</label>
<input type="password" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Confirm Password</label>
<input type="password" class="form-control" required>
</div>
</div>

<button class="btn btn-success w-100">Create Account</button>

</form>
</div>

</div>
</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
